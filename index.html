<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR - DGF WHP</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: min(92vw, 560px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      text-align: center;
      font-size: 15px;
      line-height: 1.45;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 30px rgba(0,0,0,.25);
    }

    #title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: .82;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      z-index: 30;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 14px;
    }

    button {
      min-width: 190px;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 10px 18px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 8px 28px rgba(0,0,0,.3);
      transition: transform .15s ease, opacity .15s ease;
    }

    button:active {
      transform: scale(.95);
    }

    #arrange-button {
      background: linear-gradient(135deg, #ffffff, #dff8ff);
      color: #101820;
    }

    #reset-button {
      min-width: 110px;
      display: none;
      background: rgba(255,255,255,.88);
      color: #111;
    }

    #explode-button {
      display: none;
      background: linear-gradient(135deg, #ff5252, #ff1744);
      color: #fff;
      min-width: 190px;
    }

    button:disabled {
      opacity: .5;
      cursor: default;
    }

    /* ซ่อนปุ่มจนกว่าจะพบ Hiro */
    .hidden {
      display: none !important;
    }
  </style>

  <script>
    /*
     * ============================================================
     * AR DGF - WHP
     * ============================================================
     * โครงสร้างต่อยอดจาก AR.js + A-Frame + Hiro Marker เดิม
     *
     * Flow:
     * 1. พบ Hiro Marker
     * 2. D / G / F / - / W / H / P ปรากฏแยกกัน
     * 3. ตัวอักษรลอย/หมุน/เคลื่อนไหวแบบอิสระ
     * 4. กด "จัดเรียง DGF - WHP"
     * 5. ตัวอักษรเคลื่อนเข้าสู่ตำแหน่งที่ถูกต้อง
     * 6. เมื่อเรียงเสร็จ -> Sparkle Celebration
     */

    AFRAME.registerComponent('floating-letter', {
      schema: {
        index: { type: 'number', default: 0 },
        speed: { type: 'number', default: 1 },
        radius: { type: 'number', default: 0.45 }
      },

      init: function () {
        this.startTime = Math.random() * 1000;
        this.basePosition = this.el.object3D.position.clone();
        this.baseRotation = this.el.object3D.rotation.clone();
      },

      tick: function (time) {
        const data = this.data;
        const t = (time + this.startTime) * 0.001;

        if (window.arLettersArranging || window.arSuccess || window.arExploded) return;

        const i = data.index;
        const phase = i * 0.92;

        this.el.object3D.position.x =
          this.basePosition.x + Math.sin(t * data.speed + phase) * data.radius;

        this.el.object3D.position.y =
          this.basePosition.y + Math.sin(t * data.speed * 1.35 + phase) * 0.14;

        this.el.object3D.position.z =
          this.basePosition.z + Math.cos(t * data.speed * 0.8 + phase) * 0.22;

        this.el.object3D.rotation.y =
          this.baseRotation.y + Math.sin(t * 1.1 + phase) * 0.35;

        this.el.object3D.rotation.z =
          this.baseRotation.z + Math.cos(t * 0.9 + phase) * 0.16;
      }
    });

    AFRAME.registerComponent('sparkle-particle', {
      init: function () {
        this.life = 0;
        this.duration = 900 + Math.random() * 700;
        this.velocity = new THREE.Vector3(
          (Math.random() - 0.5) * 0.9,
          Math.random() * 0.9 + 0.25,
          (Math.random() - 0.5) * 0.9
        );

        this.el.object3D.scale.setScalar(0.2 + Math.random() * 0.8);
      },

      tick: function (_time, deltaMs) {
        this.life += deltaMs;

        const dt = deltaMs / 1000;
        this.el.object3D.position.addScaledVector(this.velocity, dt);
        this.velocity.y -= 0.55 * dt;

        const progress = Math.min(this.life / this.duration, 1);
        const scale = Math.max(0, 1 - progress);

        this.el.object3D.scale.setScalar(scale);

        if (progress >= 1 && this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
      }
    });

    function createSparkles() {
      const sparkleRoot = document.querySelector('#sparkle-root');
      if (!sparkleRoot) return;

      sparkleRoot.innerHTML = '';

      const colors = [
        '#ffffff',
        '#00e5ff',
        '#7c4dff',
        '#ffea00',
        '#ff80ab',
        '#69f0ae'
      ];

      for (let i = 0; i < 42; i++) {
        const particle = document.createElement('a-sphere');

        const angle = Math.random() * Math.PI * 2;
        const distance = 0.25 + Math.random() * 0.65;

        particle.setAttribute('radius', 0.018 + Math.random() * 0.025);
        particle.setAttribute('position', {
          x: Math.cos(angle) * distance,
          y: 0.75 + Math.random() * 0.55,
          z: Math.sin(angle) * distance
        });

        const color = colors[Math.floor(Math.random() * colors.length)];

        particle.setAttribute('material',
          `color: ${color}; emissive: ${color}; emissiveIntensity: 2;`
        );

        particle.setAttribute('sparkle-particle', '');

        sparkleRoot.appendChild(particle);
      }

      // สร้างประกายซ้ำอีกชุดหลังจากช่วงสั้น ๆ
      setTimeout(() => {
        if (window.arSuccess) createSparkles();
      }, 750);
    }

    function animateToPosition(el, target, duration = 1100) {
      return new Promise(resolve => {
        const start = el.object3D.position.clone();
        const startRot = el.object3D.rotation.clone();
        const startTime = performance.now();

        function step(now) {
          const progress = Math.min((now - startTime) / duration, 1);

          // easeInOutCubic
          const eased =
            progress < 0.5
              ? 4 * progress * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 3) / 2;

          el.object3D.position.lerpVectors(start, target, eased);

          // หมุนให้กลับมาอยู่ในระนาบเดียวกับ Hiro Marker โดยคว่ำ/หงายให้ถูกทิศ
          el.object3D.rotation.x = startRot.x * (1 - eased);
          el.object3D.rotation.y = startRot.y * (1 - eased);
          el.object3D.rotation.z =
            startRot.z * (1 - eased) + THREE.MathUtils.degToRad(180) * eased;

          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            el.object3D.position.copy(target);
            el.object3D.rotation.set(0, 0, THREE.MathUtils.degToRad(180));
            resolve();
          }
        }

        requestAnimationFrame(step);
      });
    }

    AFRAME.registerComponent('explosion-particle', {
      init: function () {
        this.life = 0;
        this.duration = 650 + Math.random() * 500;
        const v = new THREE.Vector3(
          (Math.random() - 0.5) * 3.8,
          (Math.random() - 0.1) * 3.0,
          (Math.random() - 0.5) * 3.8
        );
        this.velocity = v;
      },
      tick: function (_time, deltaMs) {
        this.life += deltaMs;
        const dt = deltaMs / 1000;
        this.el.object3D.position.addScaledVector(this.velocity, dt);
        this.velocity.multiplyScalar(0.985);
        this.velocity.y -= 1.4 * dt;
        const progress = Math.min(this.life / this.duration, 1);
        this.el.object3D.scale.setScalar(Math.max(0, 1 - progress));
        if (progress >= 1 && this.el.parentNode) this.el.parentNode.removeChild(this.el);
      }
    });

    function explodeLetters() {
      if (window.arExploded) return;
      window.arExploded = true;
      const sparkleRoot = document.querySelector('#sparkle-root');
      const colors = ['#ffffff','#00e5ff','#7c4dff','#ffea00','#ff80ab','#69f0ae','#ff5252'];
      letters.forEach((letter, i) => {
        const origin = letter.object3D.position.clone();
        for (let j = 0; j < 10; j++) {
          const particle = document.createElement('a-sphere');
          particle.setAttribute('radius', 0.025 + Math.random() * 0.035);
          particle.setAttribute('position', origin);
          const c = colors[(i + j) % colors.length];
          particle.setAttribute('material', `color:${c}; emissive:${c}; emissiveIntensity:3`);
          particle.setAttribute('explosion-particle', '');
          sparkleRoot.appendChild(particle);
        }
      });

      letters.forEach((letter, i) => {
        const dir = new THREE.Vector3(
          (i - 3) * 0.65 + (Math.random()-0.5)*0.35,
          0.5 + Math.random()*0.7,
          (Math.random()-0.5)*0.8
        );
        const target = letter.object3D.position.clone().add(dir);
        animateToPosition(letter, target, 500 + i * 25);
      });

      topPanel.innerHTML = `
        <div id="title">BOOM! DGF - WHP</div>
        <span class="hint">ระเบิดออกแล้วค่ะ</span>
      `;
      document.querySelector('#explode-button').disabled = true;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const topPanel = document.querySelector('#top-panel');
      const arrangeButton = document.querySelector('#arrange-button');
      const resetButton = document.querySelector('#reset-button');
      const explodeButton = document.querySelector('#explode-button');
      const letters = Array.from(document.querySelectorAll('.ar-letter'));

      window.arLettersArranging = false;
      window.arSuccess = false;
      window.arExploded = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = `
          <div id="title">พบ Hiro Marker แล้ว</div>
          <span class="hint">ตัวอักษร DGF - WHP พร้อมทำงานแล้วค่ะ</span>
        `;

        arrangeButton.classList.remove('hidden');
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = `
          <div id="title">กำลังค้นหา Hiro Marker...</div>
          <span class="hint">เล็งกล้องไปที่ Hiro Marker และให้เห็นกรอบ Marker ครบทั้งสี่ด้าน</span>
        `;
      });

      arrangeButton.addEventListener('click', async () => {
        if (window.arLettersArranging || window.arSuccess || window.arExploded) return;

        window.arLettersArranging = true;
        window.arSuccess = false;

        arrangeButton.disabled = true;
        arrangeButton.textContent = 'กำลังเรียง...';

        topPanel.innerHTML = `
          <div id="title">กำลังจัดเรียงตัวอักษร</div>
          <span class="hint">DGF - WHP กำลังรวมตัวกันค่ะ...</span>
        `;

        /*
         * ตำแหน่งปลายทาง
         * D  G  F  -  W  H  P
         */
        const targetX = [-2.40, -1.60, -0.80, 0.00, 0.95, 1.80, 2.65];

        const animations = letters.map((letter, index) => {
          const target = new THREE.Vector3(
            targetX[index],
            0.85,
            0
          );

          return animateToPosition(letter, target, 1150 + index * 90);
        });

        await Promise.all(animations);

        window.arLettersArranging = false;
        window.arSuccess = true;

        topPanel.innerHTML = `
          <div id="title">สำเร็จ! DGF - WHP</div>
          <span class="hint">เรียงตัวอักษรถูกต้องแล้ว — ค้างไว้จนกด “ระเบิดออก!” ค่ะ ✨</span>
        `;

        arrangeButton.textContent = 'เรียงสำเร็จแล้ว';
        resetButton.style.display = 'none';
        explodeButton.style.display = 'block';

        createSparkles();
      });

      explodeButton.addEventListener('click', explodeLetters);

      resetButton.addEventListener('click', () => {
        window.arSuccess = false;
        window.arLettersArranging = false;
        window.arExploded = false;

        const startPositions = [
          [-0.95, 0.85, 0.10],
          [-0.55, 1.02, -0.18],
          [-0.18, 0.68, 0.22],
          [ 0.12, 1.08, -0.12],
          [ 0.48, 0.70, 0.20],
          [ 0.82, 1.03, -0.18],
          [ 1.02, 0.78, 0.12]
        ];

        letters.forEach((letter, index) => {
          letter.object3D.position.set(...startPositions[index]);
          letter.object3D.rotation.set(0, 0, THREE.MathUtils.degToRad(180));
        });

        const sparkleRoot = document.querySelector('#sparkle-root');
        sparkleRoot.innerHTML = '';

        arrangeButton.disabled = false;
        arrangeButton.textContent = 'จัดเรียง DGF - WHP';
        resetButton.style.display = 'none';
        explodeButton.style.display = 'none';
        explodeButton.disabled = false;

        topPanel.innerHTML = `
          <div id="title">แยกตัวอักษรอีกครั้ง</div>
          <span class="hint">กดปุ่มเพื่อจัดเรียง DGF - WHP ค่ะ</span>
        `;
      });
    });
  </script>
</head>

<body>

  <div id="top-panel">
    <div id="title">เล็งกล้องไปที่ Hiro Marker</div>
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="arrange-button" class="hidden" type="button">
      จัดเรียง DGF - WHP
    </button>

    <button id="explode-button" type="button">
      ระเบิดออก!
    </button>

    <button id="reset-button" type="button">
      เริ่มใหม่
    </button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >

    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >

      <!-- =======================================================
           DGF - WHP
           ตัวอักษรแต่ละตัวแยกเป็น Entity ของตัวเอง
           จึงสามารถเคลื่อนที่/จัดเรียง/ทำ Animation แยกกันได้
           ======================================================= -->

      <a-text
        class="ar-letter"
        value="D"
        position="-0.95 0.85 0.10"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#00e5ff"
        side="double"
        floating-letter="index: 0; speed: 1.15; radius: 0.22"
      ></a-text>

      <a-text
        class="ar-letter"
        value="G"
        position="-0.55 1.02 -0.18"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#7c4dff"
        side="double"
        floating-letter="index: 1; speed: 0.95; radius: 0.28"
      ></a-text>

      <a-text
        class="ar-letter"
        value="F"
        position="-0.18 0.68 0.22"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#ffea00"
        side="double"
        floating-letter="index: 2; speed: 1.30; radius: 0.24"
      ></a-text>

      <a-text
        class="ar-letter"
        value="-"
        position="0.12 1.08 -0.12"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#ffffff"
        side="double"
        floating-letter="index: 3; speed: 0.80; radius: 0.20"
      ></a-text>

      <a-text
        class="ar-letter"
        value="W"
        position="0.48 0.70 0.20"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#69f0ae"
        side="double"
        floating-letter="index: 4; speed: 1.10; radius: 0.30"
      ></a-text>

      <a-text
        class="ar-letter"
        value="H"
        position="0.82 1.03 -0.18"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#ff80ab"
        side="double"
        floating-letter="index: 5; speed: 1.25; radius: 0.23"
      ></a-text>

      <a-text
        class="ar-letter"
        value="P"
        position="1.02 0.78 0.12"
        align="center"
        baseline="center"
        rotation="0 0 180"
        width="100.0"
        color="#ff9100"
        side="double"
        floating-letter="index: 6; speed: 0.90; radius: 0.27"
      ></a-text>

      <!-- วงแหวนเรืองแสงตรงกลาง เมื่อสำเร็จ -->
      <a-ring
        id="success-ring"
        position="0 0.72 0"
        rotation="-90 0 0"
        radius-inner="0.98"
        radius-outer="1.02"
        color="#00e5ff"
        material="transparent: true; opacity: 0; emissive: #00e5ff; emissiveIntensity: 2"
      ></a-ring>

      <!-- จุดประกาย -->
      <a-entity id="sparkle-root"></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
